<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot 1v1</title><style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#fff;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}#app{width:min(1400px,98vw);text-align:center}h1{margin:0 0 8px}.panel{background:#18212b;border-radius:16px;padding:18px}.hidden{display:none}button,input{font:inherit;border:0;border-radius:10px;padding:12px 16px}button{background:#35c46a;color:#fff;font-weight:700;cursor:pointer}input{width:180px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.score{font-size:24px;font-weight:bold;margin:8px}.hint{opacity:.8;font-size:14px}.game{width:100%;height:min(78vh,780px);min-height:520px;background:#258b43;border:5px solid #eee;border-radius:12px;position:relative;overflow:hidden;outline:0;touch-action:none;user-select:none}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 90px,rgba(0,0,0,.025) 90px 180px)}.line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.circle{position:absolute;width:180px;height:180px;border:2px solid #ffffff88;border-radius:50%;left:calc(50% - 90px);top:calc(50% - 90px)}.goal{position:absolute;top:30%;height:40%;width:5%;border:3px solid white;z-index:1}.goal.left{left:-2%;border-left:0}.goal.right{right:-2%;border-right:0}.player,.ball{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}.player{width:34px;height:34px;border:3px solid #fff;z-index:3}.p1{background:#35a7ff}.p2{background:#ff4f63}.ball{width:20px;height:20px;background:#fff;z-index:4;box-shadow:0 0 0 2px #222}.touch{display:none;margin-top:10px}.touch button{width:55px;height:48px;padding:0}@media(max-width:700px){.touch{display:block}.game{height:70vh;min-height:420px}}
</style></head><body><div id="app"><h1>⚽ Foot 1v1</h1><div id="menu" class="panel"><p>Foot arcade 1 contre 1.</p><div class="row"><button id="create">Créer une partie</button><input id="room" placeholder="Code de partie"><button id="join">Rejoindre</button></div><p id="status" class="hint">Crée une partie ou entre le code d'un ami.</p></div><div id="gamePanel" class="hidden"><div class="score"><span id="s1">0</span> — <span id="s2">0</span></div><div id="game" class="game" tabindex="0"><div class="field"></div><div class="line"></div><div class="circle"></div><div class="goal left"></div><div class="goal right"></div><div id="player1" class="player p1"></div><div id="player2" class="player p2"></div><div id="ball" class="ball"></div></div><p class="hint">🔵 Joueur 1 : ZQSD/WASD + Espace pour tirer · 🔴 Joueur 2 : ↑ ↓ ← → + Entrée pour tirer</p><div class="touch"><button data-k="up">▲</button><div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button data-k="kick">⚽</button></div></div></div></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const game=document.getElementById('game'),statusEl=document.getElementById('status');let peer=null,conn=null,isHost=false,playerId=1,remoteInput={};const keys=new Set();
const state={p1:{x:25,y:50,vx:0,vy:0},p2:{x:75,y:50,vx:0,vy:0},ball:{x:50,y:50,vx:0,vy:0,owner:0,stealAt:0},score:[0,0]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function setStatus(t){statusEl.textContent=t}function showGame(){document.getElementById('menu').classList.add('hidden');document.getElementById('gamePanel').classList.remove('hidden');game.focus()}
function addKey(e){keys.add(e.key);keys.add(e.code)}function delKey(e){keys.delete(e.key);keys.delete(e.code)}
window.addEventListener('keydown',e=>{addKey(e);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.key)||['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault()},{passive:false});window.addEventListener('keyup',delKey);window.addEventListener('blur',()=>keys.clear());
function has(...a){return a.some(x=>keys.has(x))}
function p1Input(){return{left:has('q','Q','KeyQ','a','A','KeyA'),right:has('d','D','KeyD'),up:has('z','Z','KeyZ','w','W','KeyW'),down:has('s','S','KeyS'),kick:has(' ','Space')}}
function p2Input(){return{left:has('ArrowLeft'),right:has('ArrowRight'),up:has('ArrowUp'),down:has('ArrowDown'),kick:has('Enter')}}
function touchInput(){return{left:has('touch_left'),right:has('touch_right'),up:has('touch_up'),down:has('touch_down'),kick:has('touch_kick')}}
function merge(a,b){return{left:a.left||b.left,right:a.right||b.right,up:a.up||b.up,down:a.down||b.down,kick:a.kick||b.kick}}
function makePeer(){return new Promise((resolve,reject)=>{peer=new Peer();peer.on('open',resolve);peer.on('error',reject);peer.on('connection',c=>{if(!isHost)return;c.on('open',()=>{conn=c;setStatus('Adversaire connecté !');showGame()});c.on('data',d=>{if(d?.type==='input')remoteInput=d.input||{}});c.on('close',()=>{conn=null;setStatus('Adversaire déconnecté.')})})})}
document.getElementById('create').onclick=async()=>{try{isHost=true;playerId=1;const id=await makePeer();document.getElementById('room').value=id;setStatus('Code à partager : '+id);showGame()}catch(e){setStatus('Impossible de créer la partie')}};
document.getElementById('join').onclick=async()=>{try{isHost=false;playerId=2;await makePeer();const id=document.getElementById('room').value.trim();if(!id)return setStatus('Entre un code.');conn=peer.connect(id);conn.on('open',()=>{setStatus('Connecté !');showGame()});conn.on('data',d=>{if(d?.type==='state'){state.p1=d.state.p1;state.p2=d.state.p2;state.ball=d.state.ball;state.score=d.state.score}})}catch(e){setStatus('Connexion impossible')}};
for(const b of document.querySelectorAll('[data-k]')){const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add('touch_'+k)});b.addEventListener('pointerup',e=>{e.preventDefault();keys.delete('touch_'+k)});b.addEventListener('pointercancel',()=>keys.delete('touch_'+k));b.addEventListener('pointerleave',()=>keys.delete('touch_'+k))}
function move(p,i){const accel=.095,max=.78,friction=.84;p.vx+=(i.right?accel:0)-(i.left?accel:0);p.vy+=(i.down?accel:0)-(i.up?accel:0);p.vx*=friction;p.vy*=friction;const speed=Math.hypot(p.vx,p.vy);if(speed>max){p.vx=p.vx/speed*max;p.vy=p.vy/speed*max}p.x=clamp(p.x+p.vx,3.5,96.5);p.y=clamp(p.y+p.vy,5,95)}
function reset(){state.ball={x:50,y:50,vx:0,vy:0,owner:0,stealAt:0};state.p1={x:25,y:50,vx:0,vy:0};state.p2={x:75,y:50,vx:0,vy:0}}
function kick(owner,p){const b=state.ball;const dx=p.vx,dy=p.vy;let len=Math.hypot(dx,dy);let nx,ny;if(len<.05){nx=owner===1?1:-1;ny=0}else{nx=dx/len;ny=dy/len}b.owner=0;b.stealAt=performance.now()+1000;b.x=p.x+nx*3.6;b.y=p.y+ny*3.6;b.vx=nx*3.8+p.vx*.9;b.vy=ny*3.8+p.vy*.9}
function ballPhysics(i1,i2){const b=state.ball,p1=state.p1,p2=state.p2,now=performance.now();
// If nobody owns it, the closest player can collect it. Once owned, the ball stays IN FRONT of the owner.
if(b.owner===0&&now>=b.stealAt){const d1=dist(b,p1),d2=dist(b,p2);if(Math.min(d1,d2)<4.7){b.owner=d1<=d2?1:2}}
if(b.owner){const p=b.owner===1?p1:p2;const opp=b.owner===1?p2:p1;const od=dist(b,opp);if(now>=b.stealAt&&od<3.9){b.owner=2-b.owner;b.stealAt=now+1000}else{let dx=p.vx,dy=p.vy,len=Math.hypot(dx,dy);if(len<.05){dx=b.owner===1?1:-1;dy=0;len=1}dx/=len;dy/=len;b.x=p.x+dx*3.4;b.y=p.y+dy*3.4;b.vx=p.vx*1.15;b.vy=p.vy*1.15}}
if((b.owner===1&&i1.kick)||(b.owner===2&&i2.kick)){kick(b.owner,b.owner===1?p1:p2)}
if(!b.owner){b.vx*=.985;b.vy*=.985;b.x+=b.vx;b.y+=b.vy;for(const p of [p1,p2]){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d<3.7&&now>=b.stealAt){const nx=dx/(d||1),ny=dy/(d||1),push=Math.max(.9,Math.hypot(p.vx,p.vy)*2.5);b.vx=nx*push+p.vx*.7;b.vy=ny*push+p.vy*.7;b.x=p.x+nx*3.7;b.y=p.y+ny*3.7}}}
if(b.y<2){b.y=2;b.vy=Math.abs(b.vy)*.82}if(b.y>98){b.y=98;b.vy=-Math.abs(b.vy)*.82}
if(b.x<-3&&b.y>30&&b.y<70){state.score[1]++;reset()}else if(b.x>103&&b.y>30&&b.y<70){state.score[0]++;reset()}}
function physics(){const touch=touchInput();const local=playerId===1?merge(p1Input(),touch):merge(p2Input(),touch);if(conn?.open)conn.send({type:'input',input:local});if(!isHost){render();return}const i1=merge(p1Input(),touch),i2=conn?.open?remoteInput:merge(p2Input(),touch);move(state.p1,i1);move(state.p2,i2);ballPhysics(i1,i2);if(conn?.open)conn.send({type:'state',state});render()}
function render(){for(const [id,p] of [['player1',state.p1],['player2',state.p2],['ball',state.ball]]){const e=document.getElementById(id);e.style.left=p.x+'%';e.style.top=p.y+'%'}document.getElementById('s1').textContent=state.score[0];document.getElementById('s2').textContent=state.score[1]}
setInterval(physics,16);render();</script></body></html>
