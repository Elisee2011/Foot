<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot 1v1</title><style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#fff;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}#app{width:min(1750px,99vw);text-align:center;padding:10px}.panel{background:#18212b;border-radius:16px;padding:22px}button{font:inherit;border:0;border-radius:10px;padding:13px 18px;background:#35c46a;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#394653}.menuBtn{display:block;width:min(380px,90vw);margin:10px auto}.hidden{display:none}.hint{opacity:.8;font-size:14px}.score{font-size:25px;font-weight:bold;margin:7px}.game{width:100%;height:min(82vh,820px);min-height:520px;background:#278d43;border:5px solid #eee;border-radius:14px;position:relative;overflow:hidden;touch-action:none;user-select:none}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 110px,rgba(0,0,0,.025) 110px 220px)}.line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.circle{position:absolute;width:190px;height:190px;border:2px solid #ffffff88;border-radius:50%;left:calc(50% - 95px);top:calc(50% - 95px)}.goal{position:absolute;top:27%;height:46%;width:5%;border:4px solid white;background:#ffffff08}.goal.left{left:-1%;border-left:0}.goal.right{right:-1%;border-right:0}.player,.ball{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}.player{width:34px;height:34px;border:3px solid #fff;z-index:3}.p1{background:#35a7ff}.p2{background:#ff4f63}.ball{width:20px;height:20px;background:#fff;z-index:4;box-shadow:0 0 0 2px #222}.touch{display:none;margin-top:10px}.touch button{width:55px;height:48px;padding:0}@media(max-width:700px){.touch{display:block}.game{height:70vh;min-height:420px}}.searching{padding:18px}.dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.2}}</style></head><body><div id="app"><h1>⚽ Foot 1v1</h1><div id="menu" class="panel"><p>Choisis ton mode de jeu.</p><button id="onlineBtn" class="menuBtn">Rejoindre une partie</button><button id="localBtn" class="menuBtn secondary">Mode local</button><div id="onlineBox" class="searching hidden"><b>Recherche d’un adversaire dans le monde entier<span class="dot">...</span></b><p id="onlineStatus" class="hint">Connexion...</p><button id="cancelSearch" class="secondary">Annuler</button></div><p id="status" class="hint"></p></div><div id="gamePanel" class="hidden"><div class="score"><span id="s1">0</span> — <span id="s2">0</span></div><div id="game" class="game"><div class="field"></div><div class="line"></div><div class="circle"></div><div class="goal left"></div><div class="goal right"></div><div id="player1" class="player p1"></div><div id="player2" class="player p2"></div><div id="ball" class="ball"></div></div><p class="hint">🔵 P1 : ZQSD/WASD + Espace · 🔴 P2 : ↑ ↓ ← → + Entrée</p><div class="touch"><button data-k="up">▲</button><div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button data-k="kick">⚽</button></div></div><button id="backBtn" class="secondary">Quitter</button></div></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const $=id=>document.getElementById(id),game=$("game"),onlineBox=$("onlineBox"),onlineStatus=$("onlineStatus"),statusEl=$("status");let peer=null,conn=null,isHost=false,playerId=1,mode='',remoteInput={},last1=false,last2=false,matchTimer=null;const MATCH_ID='foot-global-1v1-lobby-2026';const keys=new Set();const state={p1:{x:18,y:50,vx:0,vy:0},p2:{x:82,y:50,vx:0,vy:0},ball:{x:50,y:50,vx:0,vy:0,owner:0,stealAt:0},score:[0,0]};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),GT=27,GB=73,BR=1.05;
function setStatus(t){statusEl.textContent=t}function showGame(){$('menu').classList.add('hidden');$('gamePanel').classList.remove('hidden');game.focus()}function showMenu(){$('gamePanel').classList.add('hidden');$('menu').classList.remove('hidden');onlineBox.classList.add('hidden');if(matchTimer)clearTimeout(matchTimer);game.blur()}function addKey(e){keys.add(e.key);keys.add(e.code)}function delKey(e){keys.delete(e.key);keys.delete(e.code)}addEventListener('keydown',e=>{addKey(e);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.key)||['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault()},{passive:false});addEventListener('keyup',delKey);addEventListener('blur',()=>keys.clear());function has(...a){return a.some(x=>keys.has(x))}function movementInput(){return{left:has('q','Q','KeyQ','a','A','KeyA'),right:has('d','D','KeyD'),up:has('z','Z','KeyZ','w','W','KeyW'),down:has('s','S','KeyS'),kick:has(' ','Space')}}function arrowInput(){return{left:has('ArrowLeft'),right:has('ArrowRight'),up:has('ArrowUp'),down:has('ArrowDown'),kick:has('Enter')}}function touchInput(){return{left:has('touch_left'),right:has('touch_right'),up:has('touch_up'),down:has('touch_down'),kick:has('touch_kick')}}function merge(a,b){return{left:a.left||b.left,right:a.right||b.right,up:a.up||b.up,down:a.down||b.down,kick:a.kick||b.kick}}
function reset(){state.ball={x:50,y:50,vx:0,vy:0,owner:0,stealAt:0};state.p1={x:18,y:50,vx:0,vy:0};state.p2={x:82,y:50,vx:0,vy:0}}function move(p,i){const ac=.095,max=.78,fr=.84;p.vx+=(i.right?ac:0)-(i.left?ac:0);p.vy+=(i.down?ac:0)-(i.up?ac:0);p.vx*=fr;p.vy*=fr;const s=Math.hypot(p.vx,p.vy);if(s>max){p.vx=p.vx/s*max;p.vy=p.vy/s*max}p.x=clamp(p.x+p.vx,3.5,96.5);p.y=clamp(p.y+p.vy,5,95)}function shoot(owner,p,now){const b=state.ball;let dx=p.vx,dy=p.vy,s=Math.hypot(dx,dy);if(s<.05){dx=owner===1?1:-1;dy=0;s=1}else{dx/=s;dy/=s}s=Math.hypot(p.vx,p.vy);b.owner=0;b.x=p.x+dx*3.5;b.y=p.y+dy*3.5;const power=2.25+Math.min(s,.78)*1.05;b.vx=dx*power+p.vx*.28;b.vy=dy*power+p.vy*.28;b.stealAt=now+1000}
function blockBall(b,p,oldX,oldY){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),minD=3.7;if(d<minD)return true;const sx=oldX-p.x,sy=oldY-p.y,segx=b.x-oldX,segy=b.y-oldY,seg2=segx*segx+segy*segy;if(seg2<1e-9)return false;let t=-(sx*segx+sy*segy)/seg2;t=Math.max(0,Math.min(1,t));const cx=oldX+segx*t,cy=oldY+segy*t;return Math.hypot(cx-p.x,cy-p.y)<minD}
function ballPhysics(now){const b=state.ball,p1=state.p1,p2=state.p2;if(b.owner===0&&now>=b.stealAt){const d1=dist(b,p1),d2=dist(b,p2);if(Math.min(d1,d2)<4.7)b.owner=d1<=d2?1:2}if(b.owner){const p=b.owner===1?p1:p2,opp=b.owner===1?p2:p1;if(now>=b.stealAt&&dist(b,opp)<4){b.owner=3-b.owner;b.stealAt=now+1000}else{let dx=p.vx,dy=p.vy,s=Math.hypot(dx,dy);if(s<.05){dx=b.owner===1?1:-1;dy=0;s=1}dx/=s;dy/=s;b.x=p.x+dx*3.45;b.y=p.y+dy*3.45;b.vx=p.vx;b.vy=p.vy}}if(!b.owner){const oldX=b.x,oldY=b.y;b.x+=b.vx;b.y+=b.vy;b.vx*=.992;b.vy*=.992;for(const p of[p1,p2]){if(now>=b.stealAt&&blockBall(b,p,oldX,oldY)){const d=dist(b,p)||1,nx=(b.x-p.x)/d,ny=(b.y-p.y)/d;const speed=Math.max(.55,Math.hypot(b.vx,b.vy));b.x=p.x+nx*3.75;b.y=p.y+ny*3.75;b.vx=nx*speed*.82+p.vx*.35;b.vy=ny*speed*.82+p.vy*.35;b.owner=0;b.stealAt=now+1000;break}}}const rest=.78,fr=.96,inGoal=b.y>=GT&&b.y<=GB;if(b.y<BR){b.y=BR;b.vy=Math.abs(b.vy)*rest;b.vx*=fr}if(b.y>100-BR){b.y=100-BR;b.vy=-Math.abs(b.vy)*rest;b.vx*=fr}if(b.x<BR&&!inGoal){b.x=BR;b.vx=Math.abs(b.vx)*rest;b.vy*=fr}if(b.x>100-BR&&!inGoal){b.x=100-BR;b.vx=-Math.abs(b.vx)*rest;b.vy*=fr}if(b.x<-BR&&inGoal){state.score[1]++;reset()}else if(b.x>100+BR&&inGoal){state.score[0]++;reset()}}
function render(){[['player1',state.p1],['player2',state.p2],['ball',state.ball]].forEach(([id,p])=>{const e=$(id);e.style.left=p.x+'%';e.style.top=p.y+'%'});$('s1').textContent=state.score[0];$('s2').textContent=state.score[1]}
function hostSetup(){peer=new Peer(MATCH_ID);peer.on('open',()=>{isHost=true;playerId=1;onlineStatus.textContent='Adversaire trouvé !';setStatus('Tu es le joueur 1. En attente du joueur 2...')});peer.on('connection',c=>{if(conn||!isHost){c.close();return}conn=c;c.on('open',()=>{mode='online';setStatus('Adversaire connecté !');onlineStatus.textContent='Partie trouvée !';showGame()});c.on('data',d=>{if(d?.type==='input')remoteInput=d.input||{}});c.on('close',()=>{conn=null;setStatus('Adversaire déconnecté.')})});peer.on('error',e=>{if(e.type==='unavailable-id')connectToHost();else retryMatch()})}function connectToHost(){if(peer){try{peer.destroy()}catch{}}peer=new Peer();peer.on('open',()=>{isHost=false;playerId=2;onlineStatus.textContent='Adversaire trouvé ! Connexion...';conn=peer.connect(MATCH_ID,{reliable:true});conn.on('open',()=>{mode='online';setStatus('Adversaire connecté !');onlineStatus.textContent='Partie trouvée !';showGame()});conn.on('data',d=>{if(d?.type==='state'){state.p1=d.state.p1;state.p2=d.state.p2;state.ball=d.state.ball;state.score=d.state.score}});conn.on('close',()=>setStatus('Adversaire déconnecté.'))});peer.on('error',()=>retryMatch())}function retryMatch(){if(matchTimer)clearTimeout(matchTimer);matchTimer=setTimeout(()=>{if(!onlineBox.classList.contains('hidden'))hostSetup()},1200)}function startMatchmaking(){onlineBox.classList.remove('hidden');onlineStatus.textContent='Recherche d’un adversaire...';hostSetup()}
$('onlineBtn').onclick=startMatchmaking;$('cancelSearch').onclick=()=>{if(peer)peer.destroy();conn=null;isHost=false;onlineBox.classList.add('hidden');setStatus('Recherche annulée.')};$('localBtn').onclick=()=>{mode='local';isHost=true;playerId=1;reset();showGame()};$('backBtn').onclick=()=>{if(peer)peer.destroy();conn=null;mode='';reset();showMenu()};for(const b of document.querySelectorAll('[data-k]')){const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add('touch_'+k)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys.delete('touch_'+k)))}
function physics(){const now=performance.now(),touch=touchInput(),localMovement=movementInput(),localArrows=arrowInput();const localOnline=merge(localMovement,touch);if(conn?.open)conn.send({type:'input',input:localOnline});if(!isHost){render();return}const i1=mode==='local'?merge(localMovement,touch):playerId===1?localOnline:remoteInput;const i2=mode==='local'?merge(localArrows,touch):playerId===1?remoteInput:localOnline;move(state.p1,i1);move(state.p2,i2);const e1=i1.kick&&!last1,e2=i2.kick&&!last2;last1=!!i1.kick;last2=!!i2.kick;if(e1&&state.ball.owner===1)shoot(1,state.p1,now);if(e2&&state.ball.owner===2)shoot(2,state.p2,now);ballPhysics(now);if(conn?.open)conn.send({type:'state',state});render()}setInterval(physics,16);render();</script></body></html>
