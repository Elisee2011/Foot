<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot 1v1</title><style>body{margin:0;background:#10151c;color:white;font-family:Arial;text-align:center}#app{padding:10px}.hidden{display:none}.panel{background:#18212b;border-radius:16px;padding:22px;max-width:600px;margin:auto}button{padding:13px 18px;border:0;border-radius:10px;background:#35c46a;color:white;font-weight:bold;cursor:pointer}.menuBtn{display:block;width:380px;max-width:90vw;margin:10px auto}.secondary{background:#394653}.game{width:100%;height:82vh;min-height:520px;background:#278d43;border:5px solid white;border-radius:14px;position:relative;overflow:hidden}.line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.circle{position:absolute;width:190px;height:190px;border:2px solid #ffffff88;border-radius:50%;left:calc(50% - 95px);top:calc(50% - 95px)}.goal{position:absolute;top:27%;height:46%;width:5%;border:4px solid white}.goal.left{left:-1%;border-left:0}.goal.right{right:-1%;border-right:0}.player,.ball{position:absolute;transform:translate(-50%,-50%);border-radius:50%;will-change:left,top}.player{width:34px;height:34px;border:3px solid white}.p1{background:#35a7ff}.p2{background:#ff4f63}.ball{width:20px;height:20px;background:white}.hint{opacity:.8;font-size:14px}.score{font-size:25px;font-weight:bold}.searching{padding:18px}.dot{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.2}}</style></head><body><div id="app"><h1>⚽ Foot 1v1</h1><div id="menu" class="panel"><p>Choisis ton mode de jeu.</p><button id="onlineBtn" class="menuBtn">Rejoindre une partie</button><button id="localBtn" class="menuBtn secondary">Mode local</button><div id="onlineBox" class="searching hidden"><b>Recherche d’un adversaire<span class="dot">...</span></b><p id="onlineStatus">Connexion au serveur...</p><button id="cancelSearch" class="secondary">Annuler</button></div></div><div id="gamePanel" class="hidden"><div class="score"><span id="s1">0</span> — <span id="s2">0</span></div><div id="game" class="game"><div class="line"></div><div class="circle"></div><div class="goal left"></div><div class="goal right"></div><div id="player1" class="player p1"></div><div id="player2" class="player p2"></div><div id="ball" class="ball"></div></div><p class="hint">Mode local : P1 ZQSD/WASD + Espace · P2 ↑ ↓ ← → + Entrée<br>Mode en ligne : les deux joueurs ZQSD/WASD + Espace</p><button id="backBtn" class="secondary">Quitter</button></div></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>const $=x=>document.getElementById(x),keys=new Set();let peer=null,conn=null,isHost=false,playerId=1,mode='',remoteInput={},last1=false,last2=false,retryTimer=null;const MATCH_ID='foot-global-1v1-lobby-2026';const state={p1:{x:18,y:50,vx:0,vy:0},p2:{x:82,y:50,vx:0,vy:0},ball:{x:50,y:50,vx:0,vy:0,owner:0,stealAt:0},score:[0,0]};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);addEventListener('keydown',e=>{keys.add(e.key);keys.add(e.code);if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Enter')e.preventDefault()},{passive:false});addEventListener('keyup',e=>{keys.delete(e.key);keys.delete(e.code)});addEventListener('blur',()=>keys.clear());function has(...a){return a.some(x=>keys.has(x))}function zqsd(){return{left:has('q','Q','KeyQ','a','A','KeyA'),right:has('d','D','KeyD'),up:has('z','Z','KeyZ','w','W','KeyW'),down:has('s','S','KeyS'),kick:has(' ','Space')}}function arrows(){return{left:has('ArrowLeft'),right:has('ArrowRight'),up:has('ArrowUp'),down:has('ArrowDown'),kick:has('Enter')}}function move(p,i,dt){const ACC=5.7,SPEED=46,FRICTION=7.5;p.vx+=(i.right?ACC:0)*dt-(i.left?ACC:0)*dt;p.vy+=(i.down?ACC:0)*dt-(i.up?ACC:0)*dt;const drag=Math.exp(-FRICTION*dt);p.vx*=drag;p.vy*=drag;const s=Math.hypot(p.vx,p.vy);if(s>SPEED){p.vx=p.vx/s*SPEED;p.vy=p.vy/s*SPEED}p.x=clamp(p.x+p.vx*dt,3.5,96.5);p.y=clamp(p.y+p.vy*dt,5,95)}function shoot(n,p,now){let dx=p.vx,dy=p.vy,s=Math.hypot(dx,dy);if(s<3){dx=n===1?1:-1;dy=0;s=1}else{dx/=s;dy/=s}s=Math.hypot(p.vx,p.vy);state.ball.owner=0;state.ball.x=p.x+dx*3.5;state.ball.y=p.y+dy*3.5;const power=135+Math.min(s,SPEED)*.45;state.ball.vx=dx*power;state.ball.vy=dy*power;state.ball.stealAt=now+1000}const SPEED=46;function block(b,p,ox,oy){if(dist(b,p)<3.7)return true;const sx=ox-p.x,sy=oy-p.y,x=b.x-ox,y=b.y-oy,q=x*x+y*y;if(q<1e-9)return false;let t=-(sx*x+sy*y)/q;t=Math.max(0,Math.min(1,t));return Math.hypot(ox+x*t-p.x,oy+y*t-p.y)<3.7}function ball(now,dt){const b=state.ball,p1=state.p1,p2=state.p2;if(!b.owner&&now>=b.stealAt){const d1=dist(b,p1),d2=dist(b,p2);if(Math.min(d1,d2)<4.7)b.owner=d1<=d2?1:2}if(b.owner){const p=b.owner===1?p1:p2,o=b.owner===1?p2:p1;if(now>=b.stealAt&&dist(b,o)<4){b.owner=3-b.owner;b.stealAt=now+1000}else{let dx=p.vx,dy=p.vy,s=Math.hypot(dx,dy);if(s<3){dx=b.owner===1?1:-1;dy=0;s=1}b.x=p.x+dx/s*3.45;b.y=p.y+dy/s*3.45;b.vx=p.vx;b.vy=p.vy}}else{const ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.exp(-.7*dt);b.vy*=Math.exp(-.7*dt);for(const p of[p1,p2])if(now>=b.stealAt&&block(b,p,ox,oy)){const d=dist(b,p)||1,nx=(b.x-p.x)/d,ny=(b.y-p.y)/d,v=Math.max(35,Math.hypot(b.vx,b.vy));b.x=p.x+nx*3.75;b.y=p.y+ny*3.75;b.vx=nx*v*.82+p.vx*.35;b.vy=ny*v*.82+p.vy*.35;b.stealAt=now+1000;break}}const g=b.y>=27&&b.y<=73;if(b.y<1.05){b.y=1.05;b.vy=Math.abs(b.vy)*.78}if(b.y>98.95){b.y=98.95;b.vy=-Math.abs(b.vy)*.78}if(b.x<1.05&&!g){b.x=1.05;b.vx=Math.abs(b.vx)*.78}if(b.x>98.95&&!g){b.x=98.95;b.vx=-Math.abs(b.vx)*.78}if(b.x<-1.05&&g){state.score[1]++;reset()}if(b.x>101.05&&g){state.score[0]++;reset()}}function reset(){state.p1={x:18,y:50,vx:0,vy:0};state.p2={x:82,y:50,vx:0,vy:0};state.ball={x:50,y:50,vx:0,vy:0,owner:0,stealAt:0}}function render(){[['player1',state.p1],['player2',state.p2],['ball',state.ball]].forEach(([id,p])=>{$(id).style.left=p.x+'%';$(id).style.top=p.y+'%'});$('s1').textContent=state.score[0];$('s2').textContent=state.score[1]}function show(){ $('menu').classList.add('hidden');$('gamePanel').classList.remove('hidden')}function closeConnection(){if(retryTimer)clearTimeout(retryTimer);if(peer){try{peer.destroy()}catch{}}peer=null;conn=null;isHost=false}function retry(){if($('onlineBox').classList.contains('hidden'))return;clearTimeout(retryTimer);retryTimer=setTimeout(startOnline,1200)}function startOnline(){if($('onlineBox').classList.contains('hidden'))return;onlineStatus.textContent='Recherche d’un adversaire...';closeConnection();$('onlineBox').classList.remove('hidden');peer=new Peer(MATCH_ID);peer.on('open',()=>{isHost=true;playerId=1;onlineStatus.textContent='Recherche d’un adversaire...'});peer.on('connection',c=>{if(conn||!isHost){c.close();return}conn=c;c.on('open',()=>{mode='online';onlineStatus.textContent='Adversaire trouvé !';show()});c.on('data',d=>{if(d?.type==='input')remoteInput=d.input||{}});c.on('close',()=>{conn=null;onlineStatus.textContent='Adversaire déconnecté. Recherche...';showSearch()})});peer.on('error',e=>{if(e.type==='unavailable-id')joinHost();else retry()})}function joinHost(){if(peer){try{peer.destroy()}catch{}}peer=new Peer();peer.on('open',()=>{isHost=false;playerId=2;onlineStatus.textContent='Adversaire trouvé ! Connexion...';conn=peer.connect(MATCH_ID,{reliable:true});conn.on('open',()=>{mode='online';onlineStatus.textContent='Partie trouvée !';show()});conn.on('data',d=>{if(d?.type==='state'){state.p1=d.state.p1;state.p2=d.state.p2;state.ball=d.state.ball;state.score=d.state.score}});conn.on('error',()=>retry());conn.on('close',()=>{onlineStatus.textContent='Adversaire déconnecté. Recherche...';showSearch()})});peer.on('error',()=>retry())}function showSearch(){$('menu').classList.remove('hidden');$('gamePanel').classList.add('hidden');$('onlineBox').classList.remove('hidden')}function startButton(){ $('onlineBox').classList.remove('hidden');startOnline()}function menu(){closeConnection();mode='';$('gamePanel').classList.add('hidden');$('menu').classList.remove('hidden');$('onlineBox').classList.add('hidden')}$('onlineBtn').onclick=startButton;$('localBtn').onclick=()=>{closeConnection();mode='local';isHost=true;playerId=1;reset();show()};$('backBtn').onclick=menu;$('cancelSearch').onclick=menu;let lastTime=performance.now();function gameLoop(now){const dt=Math.min((now-lastTime)/1000,.033);lastTime=now;const local=zqsd();if(conn?.open)conn.send({type:'input',input:local});if(isHost){const i1=mode==='local'?zqsd():playerId===1?local:remoteInput;const i2=mode==='local'?arrows():playerId===1?remoteInput:local;move(state.p1,i1,dt);move(state.p2,i2,dt);const k1=i1.kick&&!last1,k2=i2.kick&&!last2;last1=!!i1.kick;last2=!!i2.kick;if(k1&&state.ball.owner===1)shoot(1,state.p1,now);if(k2&&state.ball.owner===2)shoot(2,state.p2,now);ball(now,dt);if(conn?.open)conn.send({type:'state',state})}render();requestAnimationFrame(gameLoop)}requestAnimationFrame(gameLoop);render();</script></body></html>
