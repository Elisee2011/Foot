<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Foot 1v1</title><style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#fff;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}#app{width:min(1100px,96vw);text-align:center}h1{margin:0 0 10px}.panel{background:#18212b;border-radius:16px;padding:18px}.hidden{display:none}button,input{font:inherit;border:0;border-radius:10px;padding:12px 16px}button{background:#35c46a;color:#fff;font-weight:700;cursor:pointer}input{width:180px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.score{font-size:24px;font-weight:bold;margin:8px}.hint{opacity:.8;font-size:14px}.game{width:100%;aspect-ratio:16/9;background:#258b43;border:5px solid #eee;border-radius:12px;position:relative;overflow:hidden;outline:0;touch-action:none}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 60px,rgba(0,0,0,.025) 60px 120px)}.line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.circle{position:absolute;width:120px;height:120px;border:2px solid #ffffff88;border-radius:50%;left:calc(50% - 60px);top:calc(50% - 60px)}.goal{position:absolute;top:35%;height:30%;width:4%;border:3px solid white}.goal.left{left:-2%;border-left:0}.goal.right{right:-2%;border-right:0}.player,.ball{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}.player{width:30px;height:30px;border:3px solid #fff;z-index:3}.p1{background:#35a7ff}.p2{background:#ff4f63}.ball{width:18px;height:18px;background:#fff;z-index:4;box-shadow:0 0 0 2px #222}.touch{display:none;margin-top:10px}.touch button{width:55px;height:48px;padding:0}@media(max-width:700px){.touch{display:block}}</style></head><body><div id="app"><h1>⚽ Foot 1v1</h1><div id="menu" class="panel"><p>Jeu de foot arcade 1 contre 1.</p><div class="row"><button id="create">Créer une partie</button><input id="room" placeholder="Code de partie"><button id="join">Rejoindre</button></div><p id="status" class="hint">Crée une partie ou entre le code d'un ami.</p></div><div id="gamePanel" class="hidden"><div class="score"><span id="s1">0</span> — <span id="s2">0</span></div><div id="game" class="game" tabindex="0"><div class="field"></div><div class="line"></div><div class="circle"></div><div class="goal left"></div><div class="goal right"></div><div id="player1" class="player p1"></div><div id="player2" class="player p2"></div><div id="ball" class="ball"></div></div><p class="hint">Bleu : ZQSD/WASD · Rouge : ↑ ↓ ← → · Tir : Espace / Entrée</p><div class="touch"><button data-k="up">▲</button><div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button data-k="kick">⚽</button></div></div></div></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const game=document.getElementById('game'),statusEl=document.getElementById('status');let peer=null,conn=null,isHost=false,playerId=1,remoteInput={};const state={p1:{x:25,y:50,vx:0,vy:0},p2:{x:75,y:50,vx:0,vy:0},ball:{x:50,y:50,vx:0,vy:0,owner:0},score:[0,0]};const keys=new Set();
function setStatus(t){statusEl.textContent=t}function showGame(){document.getElementById('menu').classList.add('hidden');document.getElementById('gamePanel').classList.remove('hidden');game.focus()}
function downName(e){return[e.key,e.code]}window.addEventListener('keydown',e=>{downName(e).forEach(k=>keys.add(k));if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Space','Enter'].includes(e.key)||['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault()},{passive:false});window.addEventListener('keyup',e=>downName(e).forEach(k=>keys.delete(k)));window.addEventListener('blur',()=>keys.clear());
function has(...names){return names.some(k=>keys.has(k))}function inputFor1(){return{left:has('q','Q','KeyQ','a','A','KeyA'),right:has('d','D','KeyD'),up:has('z','Z','KeyZ','w','W','KeyW'),down:has('s','S','KeyS'),kick:has('e','E','KeyE',' ','Space')}}function inputFor2(){return{left:has('ArrowLeft','arrowleft'),right:has('ArrowRight','arrowright'),up:has('ArrowUp','arrowup'),down:has('ArrowDown','arrowdown'),kick:has('Enter','enter')}}
function makePeer(){return new Promise((resolve,reject)=>{peer=new Peer();peer.on('open',resolve);peer.on('error',reject);peer.on('connection',c=>{if(!isHost)return;c.on('open',()=>{conn=c;setStatus('Adversaire connecté !');showGame()});c.on('data',d=>{if(d&&d.type==='input')remoteInput=d.input||{}});c.on('close',()=>{conn=null;setStatus('Adversaire déconnecté.')})})})}
document.getElementById('create').onclick=async()=>{try{isHost=true;playerId=1;const id=await makePeer();document.getElementById('room').value=id;setStatus('Code à partager : '+id);showGame()}catch(e){setStatus('Impossible de créer la partie : '+e.message)}};document.getElementById('join').onclick=async()=>{try{isHost=false;playerId=2;await makePeer();const id=document.getElementById('room').value.trim();if(!id)return setStatus('Entre un code.');conn=peer.connect(id);conn.on('open',()=>{setStatus('Connecté !');showGame()});conn.on('data',d=>{if(d&&d.type==='state'){state.p1=d.state.p1;state.p2=d.state.p2;state.ball=d.state.ball;state.score=d.state.score}})}catch(e){setStatus('Connexion impossible : '+e.message)}};
for(const b of document.querySelectorAll('[data-k]')){const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add('touch_'+k)});b.addEventListener('pointerup',e=>{e.preventDefault();keys.delete('touch_'+k)});b.addEventListener('pointerleave',()=>keys.delete('touch_'+k))}function touchInput(){return{left:has('touch_left'),right:has('touch_right'),up:has('touch_up'),down:has('touch_down'),kick:has('touch_kick')}}function merge(a,b){return{left:a.left||b.left,right:a.right||b.right,up:a.up||b.up,down:a.down||b.down,kick:a.kick||b.kick}}
function apply(p,i){const sp=.65;p.vx=(i.right?sp:0)-(i.left?sp:0);p.vy=(i.down?sp:0)-(i.up?sp:0);p.x=Math.max(3,Math.min(97,p.x+p.vx));p.y=Math.max(5,Math.min(95,p.y+p.vy))}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function reset(){state.ball={x:50,y:50,vx:0,vy:0,owner:0};state.p1={x:25,y:50,vx:0,vy:0};state.p2={x:75,y:50,vx:0,vy:0}}
function updateBall(){const b=state.ball,p1=state.p1,p2=state.p2;const d1=distance(b,p1),d2=distance(b,p2);if(b.owner===0){if(d1<6)b.owner=1;else if(d2<6)b.owner=2}else{const opponent=b.owner===1?d2:d1;if(opponent<5.8)b.owner=b.owner===1?2:1}if(b.owner===1){b.x=p1.x;b.y=p1.y}else if(b.owner===2){b.x=p2.x;b.y=p2.y}else{b.vx*=.985;b.vy*=.985;b.x+=b.vx;b.y+=b.vy}
const wholeBallBeyondLeft=b.x<=-3,wholeBallBeyondRight=b.x>=103;if(wholeBallBeyondLeft){state.score[1]++;reset()}else if(wholeBallBeyondRight){state.score[0]++;reset()}if(b.y<2||b.y>98){b.y=Math.max(2,Math.min(98,b.y));b.vy*=-.8}}
function physics(){const touch=touchInput();const local=playerId===1?merge(inputFor1(),touch):merge(inputFor2(),touch);if(conn?.open)conn.send({type:'input',input:local});if(!isHost){render();return}const hostP1=merge(inputFor1(),touch),hostP2=merge(inputFor2(),touch);apply(state.p1,hostP1);apply(state.p2,conn?.open?remoteInput:hostP2);const p1Kick=hostP1.kick,p2Kick=(conn?.open?remoteInput:hostP2).kick;if(p1Kick&&state.ball.owner===1){state.ball.owner=0;state.ball.vx=state.p1.x<50?3.2:-3.2;state.ball.vy=state.p1.vy*.6}if(p2Kick&&state.ball.owner===2){state.ball.owner=0;state.ball.vx=state.p2.x<50?3.2:-3.2;state.ball.vy=state.p2.vy*.6}updateBall();if(conn?.open)conn.send({type:'state',state});render()}
function render(){for(const [id,p] of [['player1',state.p1],['player2',state.p2],['ball',state.ball]]){const el=document.getElementById(id);el.style.left=p.x+'%';el.style.top=p.y+'%'}document.getElementById('s1').textContent=state.score[0];document.getElementById('s2').textContent=state.score[1]}setInterval(physics,20);render();
</script></body></html>
