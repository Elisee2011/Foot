<!doctype html><html><head><meta charset="utf-8"><title>Foot 1v1</title><style>body{margin:0;background:#10151c;color:white;font-family:Arial;text-align:center}#app{padding:10px}.hidden{display:none}.panel{background:#18212b;border-radius:16px;padding:22px;max-width:600px;margin:auto}button{padding:13px 18px;border:0;border-radius:10px;background:#35c46a;color:white;font-weight:bold;cursor:pointer}.menuBtn{display:block;width:380px;max-width:90vw;margin:10px auto}.secondary{background:#394653}.game{width:100%;height:82vh;min-height:520px;background:#278d43;border:5px solid white;border-radius:14px;position:relative;overflow:hidden}.line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.circle{position:absolute;width:190px;height:190px;border:2px solid #ffffff88;border-radius:50%;left:calc(50% - 95px);top:calc(50% - 95px)}.goal{position:absolute;top:27%;height:46%;width:5%;border:4px solid white}.goal.left{left:-1%;border-left:0}.goal.right{right:-1%;border-right:0}.player,.ball{position:absolute;transform:translate(-50%,-50%);border-radius:50%}.player{width:34px;height:34px;border:3px solid white}.p1{background:#35a7ff}.p2{background:#ff4f63}.ball{width:20px;height:20px;background:white}.hint{opacity:.8;font-size:14px}.score{font-size:25px;font-weight:bold}.searching{padding:18px}</style></head><body><div id="app"><h1>⚽ Foot 1v1</h1><div id="menu" class="panel"><p>Choisis ton mode de jeu.</p><button id="onlineBtn" class="menuBtn">Rejoindre une partie</button><button id="localBtn" class="menuBtn secondary">Mode local</button><div id="onlineBox" class="searching hidden">Recherche d’un adversaire...<br><button id="cancelSearch" class="secondary">Annuler</button></div></div><div id="gamePanel" class="hidden"><div class="score"><span id="s1">0</span> — <span id="s2">0</span></div><div id="game" class="game"><div class="line"></div><div class="circle"></div><div class="goal left"></div><div class="goal right"></div><div id="player1" class="player p1"></div><div id="player2" class="player p2"></div><div id="ball" class="ball"></div></div><p class="hint">Mode local : P1 ZQSD/WASD + Espace · P2 ↑ ↓ ← → + Entrée<br>Mode en ligne : les deux joueurs ZQSD/WASD + Espace</p><button id="backBtn" class="secondary">Quitter</button></div></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>const $=x=>document.getElementById(x),keys=new Set();let peer,conn,isHost=false,playerId=1,mode='',remoteInput={},last1=false,last2=false;const MATCH_ID='foot-global-1v1-lobby-2026';const state={p1:{x:18,y:50,vx:0,vy:0},p2:{x:82,y:50,vx:0,vy:0},ball:{x:50,y:50,vx:0,vy:0,owner:0,stealAt:0},score:[0,0]};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);addEventListener('keydown',e=>{keys.add(e.key);keys.add(e.code);if(e.code.startsWith('Arrow')||e.code==='Space'||e.code==='Enter')e.preventDefault()},{passive:false});addEventListener('keyup',e=>{keys.delete(e.key);keys.delete(e.code)});function has(...a){return a.some(x=>keys.has(x))}function zqsd(){return{left:has('q','Q','KeyQ','a','A','KeyA'),right:has('d','D','KeyD'),up:has('z','Z','KeyZ','w','W','KeyW'),down:has('s','S','KeyS'),kick:has(' ','Space')}}function arrows(){return{left:has('ArrowLeft'),right:has('ArrowRight'),up:has('ArrowUp'),down:has('ArrowDown'),kick:has('Enter')}}function move(p,i){const ACC=.095,SPEED=.78,FRICTION=.84;p.vx+=(i.right?ACC:0)-(i.left?ACC:0);p.vy+=(i.down?ACC:0)-(i.up?ACC:0);p.vx*=FRICTION;p.vy*=FRICTION;const s=Math.hypot(p.vx,p.vy);if(s>SPEED){p.vx=p.vx/s*SPEED;p.vy=p.vy/s*SPEED}p.x=clamp(p.x+p.vx,3.5,96.5);p.y=clamp(p.y+p.vy,5,95)}function shoot(n,p,now){let dx=p.vx,dy=p.vy,s=Math.hypot(dx,dy);if(s<.05){dx=n===1?1:-1;dy=0;s=1}else{dx/=s;dy/=s}s=Math.hypot(p.vx,p.vy);state.ball.owner=0;state.ball.x=p.x+dx*3.5;state.ball.y=p.y+dy*3.5;const power=2.25+Math.min(s,.78)*1.05;state.ball.vx=dx*power+p.vx*.28;state.ball.vy=dy*power+p.vy*.28;state.ball.stealAt=now+1000}function block(b,p,ox,oy){const dx=b.x-p.x,dy=b.y-p.y;if(Math.hypot(dx,dy)<3.7)return true;const sx=ox-p.x,sy=oy-p.y,x=b.x-ox,y=b.y-oy,q=x*x+y*y;if(q<1e-9)return false;let t=-(sx*x+sy*y)/q;t=Math.max(0,Math.min(1,t));return Math.hypot(ox+x*t-p.x,oy+y*t-p.y)<3.7}function ball(now){const b=state.ball,p1=state.p1,p2=state.p2;if(!b.owner&&now>=b.stealAt){const d1=dist(b,p1),d2=dist(b,p2);if(Math.min(d1,d2)<4.7)b.owner=d1<=d2?1:2}if(b.owner){const p=b.owner===1?p1:p2,o=b.owner===1?p2:p1;if(now>=b.stealAt&&dist(b,o)<4){b.owner=3-b.owner;b.stealAt=now+1000}else{let dx=p.vx,dy=p.vy,s=Math.hypot(dx,dy);if(s<.05){dx=b.owner===1?1:-1;dy=0;s=1}b.x=p.x+dx/s*3.45;b.y=p.y+dy/s*3.45;b.vx=p.vx;b.vy=p.vy}}else{const ox=b.x,oy=b.y;b.x+=b.vx;b.y+=b.vy;b.vx*=.992;b.vy*=.992;for(const p of[p1,p2])if(now>=b.stealAt&&block(b,p,ox,oy)){const d=dist(b,p)||1,nx=(b.x-p.x)/d,ny=(b.y-p.y)/d,v=Math.max(.55,Math.hypot(b.vx,b.vy));b.x=p.x+nx*3.75;b.y=p.y+ny*3.75;b.vx=nx*v*.82+p.vx*.35;b.vy=ny*v*.82+p.vy*.35;b.stealAt=now+1000;break}}const g=b.y>=27&&b.y<=73;if(b.y<1.05){b.y=1.05;b.vy=Math.abs(b.vy)*.78;b.vx*=.96}if(b.y>98.95){b.y=98.95;b.vy=-Math.abs(b.vy)*.78;b.vx*=.96}if(b.x<1.05&&!g){b.x=1.05;b.vx=Math.abs(b.vx)*.78;b.vy*=.96}if(b.x>98.95&&!g){b.x=98.95;b.vx=-Math.abs(b.vx)*.78;b.vy*=.96}if(b.x<-1.05&&g){state.score[1]++;reset()}if(b.x>101.05&&g){state.score[0]++;reset()}}function reset(){state.p1={x:18,y:50,vx:0,vy:0};state.p2={x:82,y:50,vx:0,vy:0};state.ball={x:50,y:50,vx:0,vy:0,owner:0,stealAt:0}}function render(){[['player1',state.p1],['player2',state.p2],['ball',state.ball]].forEach(([id,p])=>{$(id).style.left=p.x+'%';$(id).style.top=p.y+'%'});$('s1').textContent=state.score[0];$('s2').textContent=state.score[1]}function game(){const now=performance.now(),local=zqsd();if(conn?.open)conn.send({type:'input',input:local});if(!isHost){render();return}const i1=mode==='local'?zqsd():playerId===1?local:remoteInput;const i2=mode==='local'?arrows():playerId===1?remoteInput:local;move(state.p1,i1);move(state.p2,i2);const k1=i1.kick&&!last1,k2=i2.kick&&!last2;last1=!!i1.kick;last2=!!i2.kick;if(k1&&state.ball.owner===1)shoot(1,state.p1,now);if(k2&&state.ball.owner===2)shoot(2,state.p2,now);ball(now);if(conn?.open)conn.send({type:'state',state});render()}function show(){ $('menu').classList.add('hidden');$('gamePanel').classList.remove('hidden')}function menu(){ $('gamePanel').classList.add('hidden');$('menu').classList.remove('hidden');if(peer)peer.destroy()}function host(){peer=new Peer(MATCH_ID);peer.on('open',()=>{isHost=true;playerId=1});peer.on('connection',c=>{if(conn||!isHost)return;c.on('open',()=>{conn=c;mode='online';show()});c.on('data',d=>{if(d.type==='input')remoteInput=d.input});c.on('close',()=>conn=null)});peer.on('error',e=>{if(e.type==='unavailable-id')join();else setTimeout(host,1000)})}function join(){if(peer)peer.destroy();peer=new Peer();peer.on('open',()=>{isHost=false;playerId=2;conn=peer.connect(MATCH_ID,{reliable:true});conn.on('open',()=>{mode='online';show()});conn.on('data',d=>{if(d.type==='state'){state.p1=d.state.p1;state.p2=d.state.p2;state.ball=d.state.ball;state.score=d.state.score}})});peer.on('error',()=>setTimeout(host,1000))}$('onlineBtn').onclick=()=>host();$('localBtn').onclick=()=>{mode='local';isHost=true;playerId=1;reset();show()};$('backBtn').onclick=menu;$('cancelSearch').onclick=menu;setInterval(game,16);render();</script></body></html>
