<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Foot 1v1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#fff;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}#app{width:min(1100px,96vw);text-align:center}h1{margin:0 0 10px;font-size:34px}.panel{background:#18212b;border-radius:16px;padding:18px;margin-bottom:14px}.hidden{display:none}button,input{font:inherit;border:0;border-radius:10px;padding:12px 16px}button{background:#35c46a;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.1)}input{width:180px;background:#fff;color:#111}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.score{font-size:24px;font-weight:bold;margin:8px}.hint{opacity:.8;font-size:14px}.game-wrap{position:relative}.game{width:100%;aspect-ratio:16/9;background:#258b43;border:5px solid #e9e9e9;border-radius:12px;position:relative;overflow:hidden}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 60px,rgba(0,0,0,.025) 60px 120px)}.line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.65)}.circle{position:absolute;width:120px;height:120px;border:2px solid rgba(255,255,255,.65);border-radius:50%;left:calc(50% - 60px);top:calc(50% - 60px)}.goal{position:absolute;top:35%;height:30%;width:4%;border:3px solid white}.goal.left{left:-2%;border-left:0}.goal.right{right:-2%;border-right:0}.player,.ball{position:absolute;transform:translate(-50%,-50%);border-radius:50%}.player{width:28px;height:28px;border:3px solid #fff;z-index:3}.p1{background:#35a7ff}.p2{background:#ff4f63}.ball{width:18px;height:18px;background:#fff;z-index:4;box-shadow:0 0 0 2px #222}.touch{display:none;margin-top:10px}.touch button{width:55px;height:48px;padding:0}@media(max-width:700px){.touch{display:block}.game{border-width:3px}h1{font-size:26px}}
</style></head>
<body><div id="app"><h1>⚽ Foot 1v1</h1>
<div id="menu" class="panel"><p>Jeu de foot arcade 1 contre 1 dans le navigateur.</p><div class="row"><button id="create">Créer une partie</button><input id="room" placeholder="Code de partie"><button id="join">Rejoindre</button></div><p id="status" class="hint">Crée une partie ou entre le code d'un ami.</p></div>
<div id="gamePanel" class="hidden"><div class="score"><span id="s1">0</span> — <span id="s2">0</span></div><div class="game-wrap"><div id="game" class="game"><div class="field"></div><div class="line"></div><div class="circle"></div><div class="goal left"></div><div class="goal right"></div><div id="player1" class="player p1"></div><div id="player2" class="player p2"></div><div id="ball" class="ball"></div></div></div><p class="hint">Bleu : ZQSD / WASD + Espace pour tirer · Rouge : flèches + Entrée</p><div class="touch"><button data-k="up">▲</button><div><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button data-k="kick">⚽</button></div></div></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const game=document.getElementById('game'), statusEl=document.getElementById('status');let peer,conn,isHost=false,playerId=1;
const state={p1:{x:25,y:50,vx:0,vy:0},p2:{x:75,y:50,vx:0,vy:0},ball:{x:50,y:50,vx:0,vy:0},score:[0,0]};
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function setStatus(t){statusEl.textContent=t}
function showGame(){document.getElementById('menu').classList.add('hidden');document.getElementById('gamePanel').classList.remove('hidden')}
function makePeer(){return new Promise((resolve,reject)=>{peer=new Peer();peer.on('open',id=>resolve(id));peer.on('error',reject);peer.on('connection',c=>{if(!isHost)return;c.on('open',()=>{conn=c;playerId=1;setStatus('Adversaire connecté !');showGame()});c.on('data',d=>{if(d.type==='input')remoteInput=d.input})})})}
let remoteInput={};let localInput={};
document.getElementById('create').onclick=async()=>{try{isHost=true;playerId=1;const id=await makePeer();document.getElementById('room').value=id;setStatus('Code à partager : '+id)}catch(e){setStatus('Impossible de créer la partie.')}};
document.getElementById('join').onclick=async()=>{try{isHost=false;playerId=2;await makePeer();const id=document.getElementById('room').value.trim();if(!id)return setStatus('Entre un code.');conn=peer.connect(id);conn.on('open',()=>{setStatus('Connecté !');showGame()});conn.on('data',d=>{if(d.type==='state')Object.assign(state,d.state)})}catch(e){setStatus('Connexion impossible.')}};
function input(){let i={};if(playerId===1){i.left=keys.q||keys.a;i.right=keys.d;i.up=keys.z||keys.w;i.down=keys.s;i.kick=keys.e||keys[' ']}else{i.left=keys.arrowleft;i.right=keys.arrowright;i.up=keys.arrowup;i.down=keys.arrowdown;i.kick=keys.enter}return i}
for(const b of document.querySelectorAll('[data-k]')){b.onpointerdown=()=>keys[b.dataset.k]=true;b.onpointerup=b.onpointerleave=()=>keys[b.dataset.k]=false}
function apply(p,i){const sp=0.65;p.vx=(i.right?sp:0)-(i.left?sp:0);p.vy=(i.down?sp:0)-(i.up?sp:0);p.x=Math.max(3,Math.min(97,p.x+p.vx));p.y=Math.max(5,Math.min(95,p.y+p.vy))}
function physics(){if(!conn&& !isHost)return;localInput=input();if(conn&&conn.open)conn.send({type:'input',input:localInput});if(!isHost)return;apply(state.p1,localInput);apply(state.p2,remoteInput);let b=state.ball;b.vx*=.985;b.vy*=.985;b.x+=b.vx;b.y+=b.vy;if(b.y<2||b.y>98){b.y=Math.max(2,Math.min(98,b.y));b.vy*=-.8}if(b.x<0){state.score[1]++;reset()}if(b.x>100){state.score[0]++;reset()}
for(const [p,i] of [[state.p1,localInput],[state.p2,remoteInput]]){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d<5){const nx=dx/(d||1),ny=dy/(d||1);b.x=p.x+nx*5;b.y=p.y+ny*5;b.vx=nx*(i.kick?2.8:1.1)+p.vx*.4;b.vy=ny*(i.kick?2.8:1.1)+p.vy*.4}}
if(conn&&conn.open)conn.send({type:'state',state});render()}
function reset(){state.ball={x:50,y:50,vx:0,vy:0};state.p1={x:25,y:50,vx:0,vy:0};state.p2={x:75,y:50,vx:0,vy:0}}
function render(){for(const [id,p] of [['player1',state.p1],['player2',state.p2],['ball',state.ball]]){const el=document.getElementById(id);el.style.left=p.x+'%';el.style.top=p.y+'%'}document.getElementById('s1').textContent=state.score[0];document.getElementById('s2').textContent=state.score[1]}
setInterval(physics,20);render();
</script></body></html>
